name: Build

# Lints and builds each changed app for every architecture it declares. Pull
# requests build and smoke-test the images; pushes to main also publish them
# to GHCR as <image>:<version>, the tag Home Assistant pulls. A published
# version is never overwritten: a push that changes an app without bumping
# its version fails.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apps:
        description: Apps to build, separated by spaces (empty builds all). Versions already published are skipped.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      apps: ${{ steps.plan.outputs.apps }}
      builds: ${{ steps.plan.outputs.builds }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Find changed apps
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          INPUT_APPS: ${{ inputs.apps }}
        run: |
          python3 -c 'import yaml' 2>/dev/null || pip install --quiet pyyaml
          python3 .github/scripts/plan.py | tee -a "$GITHUB_OUTPUT"

  lint:
    name: Lint ${{ matrix.app }}
    needs: plan
    if: needs.plan.outputs.apps != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.plan.outputs.apps) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Home Assistant app lint
        uses: frenck/action-addon-linter@479f4f053b96ed00a83ce2c7d8f858e22475aa98 # v2.21.3
        with:
          path: ./${{ matrix.app }}

  build:
    name: Build ${{ matrix.app }} (${{ matrix.arch }})
    needs: [plan, lint]
    if: needs.plan.outputs.builds != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.builds) }}
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      TAG: ${{ matrix.image }}:${{ matrix.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: matrix.arch != 'amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check that the version is new
        id: exists
        if: env.PUBLISH == 'true'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if docker buildx imagetools inspect "$TAG" >/dev/null 2>&1; then
            if [ "$EVENT" = "workflow_dispatch" ]; then
              echo "::notice::$TAG is already published, skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::$TAG is already published. Bump version in ${{ matrix.app }}/config.yaml."
              exit 1
            fi
          fi

      - name: Build${{ env.PUBLISH == 'true' && ' and push' || '' }}
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.app }}
          platforms: ${{ matrix.platform }}
          push: ${{ env.PUBLISH == 'true' }}
          load: ${{ env.PUBLISH != 'true' && matrix.arch == 'amd64' }}
          tags: ${{ env.TAG }}
          # Plain single-platform images, which is what Home Assistant expects.
          provenance: false
          sbom: false
          build-args: |
            BUILD_VERSION=${{ matrix.version }}
            BUILD_ARCH=${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ matrix.arch }}

      - name: Smoke test
        if: env.PUBLISH != 'true' && matrix.arch == 'amd64' && hashFiles(format('.github/scripts/smoke/{0}.sh', matrix.app)) != ''
        run: bash ".github/scripts/smoke/${{ matrix.app }}.sh" "$TAG"
